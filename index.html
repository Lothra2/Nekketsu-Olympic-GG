<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Nekketsu Olympic GG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b14'/%3E%3Ctext x='1' y='12' font-size='10' font-family='monospace' font-weight='bold' fill='%23f2c230'%3EGG%3C/text%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; touch-action: none; }
      #juego { width: 100vw; height: 100vh; height: 100dvh; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #girar { display: none; position: fixed; inset: 0; background: #0b0b14; color: #f2c230; font: bold 18px monospace; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 10; }
      #girar span { font-size: 56px; display: inline-block; animation: girar 1.6s ease-in-out infinite; }
      @keyframes girar { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
    </style>
  </head>
  <body>
    <div id="juego"></div>
    <div id="girar"><span>📱</span>GIRA EL TELÉFONO<br />PARA JUGAR</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
